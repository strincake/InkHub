[package]
name = "note4-screen-scheduler"
version = "0.1.0"
edition = "2021"

[dependencies]
zectrix-sdk = { path = "vendor/zectrix-local-push-sdk" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"


[workspace]
members = ["clients/screen-scheduler-client"]
exclude = ["vendor/zectrix-local-push-sdk"]
resolver = "2"
