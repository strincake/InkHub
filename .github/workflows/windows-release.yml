name: InkHub builds and release
on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Create a draft release for an existing matching version tag
        type: boolean
        default: false
      release_tag:
        description: Existing tag, for example v0.1.0 (required for draft publishing)
        type: string
        default: ''
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  LIBOPUS_STATIC: '1'
  LIBOPUS_NO_PKG: '1'
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish_draft && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.9'
      - name: Validate release version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          PUBLISH_DRAFT: ${{ inputs.publish_draft }}
        shell: pwsh
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = $env:INPUT_TAG
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:PUBLISH_DRAFT -eq 'true') {
            if ($tag -ne "v$version") {
              throw "Release tag '$tag' does not match Cargo.toml version 'v$version'. Update Cargo.toml and Cargo.lock before tagging."
            }
          }
      - name: Prepare compiler toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --requirement requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:CMAKE_POLICY_VERSION_MINIMUM = '3.5'
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/unit -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-windows.ps1
          python tests/integration/builtin-plugins-integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/packaged-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/windows-installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build portable archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          cargo test --locked --workspace
          python -m unittest discover -s tests/unit -p 'test_*.py'
          cargo build --locked --release
          bash scripts/package-unix.sh "$PLATFORM"
          test_dir=$(mktemp -d)
          tar -xzf dist/releases/InkHub-*-"$PLATFORM".tar.gz -C "$test_dir"
          INKHUB_PYTHON="$(command -v python)" SCHEDULER_BINARY="$test_dir/InkHub/run-inkhub" \
            python tests/integration/builtin-plugins-integration.py
      - name: Test plugin editor in Chromium
        if: runner.os == 'Linux'
        shell: bash
        env:
          SCHEDULER_BINARY: ${{ github.workspace }}/target/release/note4-screen-scheduler
        run: |
          npm install --prefix artifacts/test-tools --no-audit --no-fund playwright@1.62.1
          artifacts/test-tools/node_modules/.bin/playwright install --with-deps chromium
          export NODE_PATH="$PWD/artifacts/test-tools/node_modules"
          node tests/browser/desk-note-browser-check.cjs
          node tests/browser/desk-note-host-browser-check.cjs
      - name: Package standalone plugins
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          while read -r id; do
            python scripts/pack_plugin.py "plugins/$id" "dist/plugins/$id.screen-plugin.zip"
          done < packaging/builtin-plugins.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'linux-x64'
        with:
          name: InkHub-plugins
          path: dist/plugins/*.screen-plugin.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: InkHub-${{ matrix.platform }}
          path: dist/releases/*
          if-no-files-found: error
  draft-release:
    needs: build
    if: github.ref_type == 'tag' || inputs.publish_draft == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish_draft && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: InkHub-*
          path: release-assets
          merge-multiple: true
      - name: Publish draft for verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="$INPUT_TAG"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag '$tag' does not match Cargo.toml version 'v$version'."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its notes and assets."
            exit 0
          fi
          gh release create "$tag" release-assets/* --verify-tag --draft --title "InkHub $version" --generate-notes
