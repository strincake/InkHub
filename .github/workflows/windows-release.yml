name: Windows release
on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Create a draft release for an existing matching version tag
        type: boolean
        default: false
      release_tag:
        description: Existing tag, for example v0.1.0 (required for draft publishing)
        type: string
        default: ''
  push:
    tags: ['v*']
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish_draft && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.9'
      - name: Prepare compiler toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --requirement requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build installer
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:CMAKE_POLICY_VERSION_MINIMUM = '3.5'
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/unit -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-windows.ps1
          python tests/integration/builtin-plugins-integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/packaged-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/windows-installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: InkHub-windows-x64
          path: dist/releases/*
          if-no-files-found: error
  draft-release:
    needs: build
    if: github.ref_type == 'tag' || inputs.publish_draft == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish_draft && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: InkHub-windows-x64
          path: release-assets
      - name: Publish draft for verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="$INPUT_TAG"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          test "$tag" = "v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its notes and assets."
            exit 0
          fi
          gh release create "$tag" release-assets/* --verify-tag --draft --title "InkHub $version" --generate-notes
