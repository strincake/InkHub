<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>便签</title>
<style>
:root{--paper:#ffffffb8;--solid:#f8faff;--ink:#2b374c;--muted:#6d7e96;--line:#dce3ee;--accent:#5474c6;--on-accent:#fff;--soft:#e8eef9;--stage:#edf2f8;--green:#56856f;color-scheme:light;font:14px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;color:var(--ink)}
:root[data-theme=dark]{--paper:#29364bbd;--solid:#263449;--ink:#e3eaf6;--muted:#a3b2ca;--line:#42536d;--accent:#a3baf7;--on-accent:#17263e;--soft:#41577880;--stage:#213044;--green:#9ac6af;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:24px;background:transparent}main{max-width:1240px;margin:auto}h1{font-size:25px;font-weight:600;letter-spacing:-.5px;margin:0 0 6px}h2{font-size:15px;font-weight:600;margin:0}p{font-size:12px;color:var(--muted);margin:0}button,input,textarea{font:inherit}button{font-size:12px;line-height:1.7;background:var(--soft);color:var(--ink);border:1px solid transparent;padding:9px 16px;border-radius:20px;cursor:pointer}button:hover{border-color:var(--line)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #94afe5;outline-offset:3px}input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--stage);color:var(--ink);font-size:13px;min-width:0}textarea{display:block;min-height:220px;resize:vertical;line-height:1.8}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}input[type=number]{width:82px}label{display:block;font-size:12px;color:var(--muted)}label>input:not([type=checkbox]),label>textarea{margin-top:8px}[hidden]{display:none!important}.note-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}#save{background:var(--accent);color:var(--on-accent);white-space:nowrap}.note-layout{display:grid;grid-template-columns:190px minmax(260px,1fr) minmax(300px,440px);gap:20px;align-items:start}.card{padding:22px;border:1px solid #ffffffbd;border-radius:18px;background:var(--paper);min-width:0}:root[data-theme=dark] .card{border-color:#6c7d9833}.note-sidebar{padding:18px 12px;display:flex;flex-direction:column;height:548px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px;margin-bottom:16px}#note-count{color:var(--muted);font-size:11px}#add-note{margin:0 6px 18px}#note-list{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding:0 4px;display:flex;flex-direction:column;gap:7px}.note-item{flex-shrink:0;width:100%;text-align:left;background:transparent;border-radius:10px;padding:12px 10px;min-height:68px}.note-item[aria-pressed=true]{background:var(--soft);border-color:var(--line);color:var(--accent)}.note-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}.note-snippet{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px;margin-top:4px}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}#delete-note{color:#ad635e;background:transparent;padding:4px 0;border-radius:4px}.title-toggle{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;color:var(--ink);font-size:13px}#title-row{margin-bottom:18px}fieldset{border:0;margin:0;padding:0;min-width:0}#notes-row{margin-bottom:18px}.font-control{display:flex;align-items:center;gap:12px}.font-control input{margin:0!important}.font-control span{font-size:12px;color:var(--muted)}#message{margin-top:24px;min-height:22px;color:var(--green);font-size:12px;overflow-wrap:anywhere}#message.error{color:#ba7368}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.preview-head span{font-size:11px;color:var(--muted)}#preview{display:block;width:100%;height:auto;aspect-ratio:4/3;border:1px solid var(--line);background:white;border-radius:3px}.preview-copy{margin-top:18px;font-size:11px}.empty{padding:16px 8px;font-size:12px;color:var(--muted)}#empty-editor{min-height:370px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:1060px){.note-layout{grid-template-columns:170px minmax(250px,1fr)}.preview-card{grid-column:2}.note-sidebar{grid-row:1/3;position:sticky;top:16px;height:548px}#preview{max-width:400px;margin:auto}}
@media(max-width:620px){body{padding:16px}.note-layout{grid-template-columns:1fr;gap:16px}.note-sidebar{grid-row:auto;position:static;height:240px}.preview-card{grid-column:auto}.card{padding:18px}.note-head{align-items:flex-start;gap:10px}h1{font-size:22px}.note-head p{max-width:180px}.note-head button{padding:9px 12px}textarea{min-height:180px}}
</style>
<main>
 <header class="note-head"><div><h1>便签</h1><p>把想记住的事，留在屏幕上。</p></div><button id="save" type="button" disabled>应用到设备</button></header>
 <div class="note-layout">
  <nav class="card note-sidebar" aria-label="便签管理"><div class="list-head"><h2>我的便签</h2><span id="note-count"></span></div><button id="add-note" type="button" disabled>＋ 新建</button><div id="note-list" aria-label="便签列表"></div></nav>
  <section class="card" id="editor"><div class="editor-head"><h2>编辑便签</h2><button id="delete-note" type="button" disabled>删除当前便签</button></div><div id="empty-editor" hidden>还没有便签，点击左侧“新建”开始。</div><fieldset id="note-fields" disabled><label class="title-toggle" for="show-title">显示标题<input id="show-title" type="checkbox"></label><label id="title-row">屏幕标题<input id="title" maxlength="80" autocomplete="off"></label><label id="notes-row">正文 · 回车换行<textarea id="notes" rows="8" maxlength="16000" placeholder="写下想记住的事…"></textarea></label><label class="font-control" for="font-size">正文字号<input id="font-size" type="number" min="12" max="64" step="1" value="24" required><span>px</span></label></fieldset><p id="message" role="status" aria-live="polite">正在读取设置…</p></section>
  <section class="card preview-card"><div class="preview-head"><h2>实时预览</h2><span>400 × 300</span></div><canvas id="preview" width="400" height="300" aria-label="当前便签画面预览"></canvas><p class="preview-copy">编辑即时预览，点击“应用到设备”后保存并更新画面。</p></section>
 </div>
</main>
<script>
(()=>{
 const protocol='screen-plugin-ui-v1', $=id=>document.getElementById(id);
 let settings={},notes=[],active='',loaded=false,dirty=false,saving=null,revision=0,deviceState={};
 const current=()=>notes.find(n=>n.id===active);
 const send=message=>parent.postMessage({protocol,...message},'*');
 const status=(text,error=false)=>{$('message').textContent=text;$('message').classList.toggle('error',error)};
 function theme(appearance){if(!appearance)return;document.documentElement.dataset.theme=appearance.resolved==='dark'?'dark':'light'}
 theme({resolved:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'});
 function readNotes(s){
  if(s.document?.version===2&&Array.isArray(s.document.notes))return structuredClone(s.document.notes);
  const texts=String(s.notes??'').split(/\r\n|\r|\n/).map(t=>t.trim()).filter(Boolean);
  return (texts.length?texts:['写下你的第一条便签。']).map((text,i)=>({id:'legacy-'+i,title:s.title??'',text,show_title:true,font_size:24}));
 }
 const summary=n=>n.text.replace(/\s+/gu,' ').trim();
 const name=n=>(n.show_title&&n.title.trim()?n.title.trim():Array.from(summary(n)).slice(0,12).join(''))||'空白便签';
 function list(){
  const scroll=$('note-list').scrollTop;
  $('note-list').replaceChildren();$('note-count').textContent=notes.length+' 张';
  for(const n of notes){
   const button=document.createElement('button');button.type='button';button.className='note-item';button.dataset.id=n.id;button.setAttribute('aria-pressed',String(n.id===active));
   const title=document.createElement('span');title.className='note-name';title.textContent=name(n);button.title=name(n);
   const snippet=document.createElement('span');snippet.className='note-snippet';snippet.textContent=n.show_title?(summary(n)||'空白便签'):'无标题 · 正文摘要';
   button.append(title,snippet);button.onclick=()=>{if(active===n.id)return;active=n.id;changed();editor();};$('note-list').append(button);
  }
  if(!notes.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='还没有便签';$('note-list').append(empty)}
  $('note-list').scrollTop=scroll;
 }
 function editor(){
  const n=current();$('note-fields').disabled=!n;$('note-fields').hidden=!n;$('empty-editor').hidden=!!n;$('delete-note').disabled=!n;
  $('title').value=n?.title??'';$('notes').value=n?.text??'';$('show-title').checked=n?.show_title??false;$('font-size').value=n?.font_size??24;$('title-row').hidden=!n?.show_title;
  list();preview();
 }
 function changed(){dirty=true;revision++;status(saving?'正在保存，后续修改仍保留为草稿。':'未应用 · 切换便签保留当前编辑');list();preview()}
 function shorten(text,measure){if(measure(text)<=356)return text;const chars=Array.from(text);while(chars.length&&measure(chars.join('')+'…')>356)chars.pop();return chars.join('')+'…'}
 // Match the host's json.dumps(..., ensure_ascii=False) byte budget.
 function settingsJSON(value){
  if(Array.isArray(value))return '['+value.map(settingsJSON).join(', ')+']';
  if(value&&typeof value==='object')return '{'+Object.entries(value).map(([key,item])=>JSON.stringify(key)+': '+settingsJSON(item)).join(', ')+'}';
  return JSON.stringify(value);
 }
 function wrap(text,measure){
  const lines=[];
  for(let paragraph of text.replace(/\r\n|\r/g,'\n').split('\n')){
   // Match Python expandtabs(4), including tabs in mixed Chinese/Latin text.
   let expanded='',column=0;for(const char of paragraph){if(char==='\t'){const count=4-column%4;expanded+=' '.repeat(count);column+=count}else{expanded+=char;column++}}
   let line='';for(const char of expanded){if(line&&measure(line+char)>356){lines.push(line);line=''}line+=char}lines.push(line);
  }return lines;
 }
 function preview(){
  const c=$('preview'),ctx=c.getContext('2d'),n=current();
  const dark=(settings.theme==='深色')!==!!deviceState.inverted;ctx.fillStyle=dark?'black':'white';ctx.fillRect(0,0,400,300);ctx.fillStyle=dark?'white':'black';
  if(!n){c.setAttribute('aria-label','空白便签画面');return}
  c.setAttribute('aria-label',name(n)+' · 画面预览');
  // Align the visible glyph top with Pillow's anchor='lt'.
  const draw=(text,x,y)=>{ctx.textBaseline='alphabetic';ctx.fillText(text,x,y+ctx.measureText(text).actualBoundingBoxAscent)};
  let top=22;if(n.show_title){ctx.font='21px "Microsoft YaHei", sans-serif';draw(shorten(n.title.replace(/\n/g,' '),t=>ctx.measureText(t).width),22,20);ctx.fillRect(22,60,357,1);top=82}
  const size=Math.max(12,Math.min(64,Number(n.font_size)||24));ctx.font=size+'px "Microsoft YaHei", sans-serif';
  const measure=t=>ctx.measureText(t).width,lineHeight=Math.round(size*1.45),limit=Math.max(1,Math.floor((278-top)/lineHeight)),lines=wrap(n.text,measure),visible=lines.slice(0,limit);
  if(lines.length>limit)visible[visible.length-1]=shorten(visible.at(-1)+'…',measure);
  visible.forEach((text,row)=>draw(text,22,top+row*lineHeight));
 }
 $('title').oninput=()=>{current().title=$('title').value;changed()};
 $('notes').oninput=()=>{current().text=$('notes').value;changed()};
 $('show-title').onchange=()=>{current().show_title=$('show-title').checked;$('title-row').hidden=!current().show_title;changed()};
 $('font-size').oninput=()=>{if($('font-size').validity.valid){current().font_size=Number($('font-size').value);changed()}};
 $('font-size').onchange=()=>{if(!$('font-size').validity.valid||!$('font-size').value)$('font-size').value=current().font_size};
 $('add-note').onclick=()=>{
  const id=globalThis.crypto?.randomUUID?.()??('note-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  notes.push({id,title:'',text:'',show_title:false,font_size:24});active=id;changed();editor();$('note-list').lastElementChild?.scrollIntoView({block:'nearest'});$('notes').focus({preventScroll:true});
 };
 $('delete-note').onclick=()=>{const i=notes.findIndex(n=>n.id===active);if(i<0)return;notes.splice(i,1);active=notes[Math.min(i,notes.length-1)]?.id??'';changed();editor()};
 $('save').onclick=()=>{
  if(!loaded||saving)return;
  if(!$('font-size').validity.valid){$('font-size').reportValidity();return}
  const document={version:2,notes:structuredClone(notes)};
  if(new TextEncoder().encode(settingsJSON(document)).length>32768){status('便签内容过多，请精简后再保存（总计最多 32 KiB）。',true);return}
  const request_id='save-note-'+Date.now();saving={request_id,revision};$('save').disabled=true;status('正在保存…');
  send({type:'save_settings',request_id,settings:{...settings,document,active_note:active}});
 };
 addEventListener('message',event=>{
  if(event.source!==parent||event.data?.protocol!==protocol)return;const m=event.data;
  if(m.type==='context'){
   settings=m.settings??{};deviceState=m.state??{};theme(m.appearance);
   if(!loaded||(!dirty&&!saving)){
    notes=readNotes(settings);const ids=notes.map(n=>n.id);active=ids.includes(deviceState.current_note)?deviceState.current_note:ids.includes(settings.active_note)?settings.active_note:(notes[Number(deviceState.index)||0]?.id??ids[0]??'');editor();
    status(m.enabled===false?'插件未启用，保存后将在启用时更新画面。':'已连接 · 编辑后应用到设备');
   }else preview();
   loaded=true;$('add-note').disabled=false;$('save').disabled=!!saving;
  }
  if(m.type==='appearance')theme(m.appearance);
  if(m.type==='state'){deviceState=m.state??{};preview()}
  if(m.type==='result'&&saving&&m.request_id===saving.request_id){
   const unchanged=revision===saving.revision;saving=null;$('save').disabled=false;
   if(m.ok){dirty=!unchanged;status(unchanged?'已保存，启用时自动更新画面。':'已保存，后续修改尚未应用。')}else{dirty=true;status(m.error||'保存失败，请重试。',true)}
  }
 });
 let lastHeight=0,scheduled=false;
 const report=()=>{scheduled=false;const height=Math.ceil(document.body.getBoundingClientRect().height)+12;if(height!==lastHeight){lastHeight=height;send({type:'resize',height})}};
 new ResizeObserver(()=>{if(!scheduled){scheduled=true;requestAnimationFrame(report)}}).observe(document.body);
 addEventListener('load',()=>{preview();report()});preview();send({type:'ready'});
})();
</script>
</html>
