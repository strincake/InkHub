[package]
name = "screen-scheduler-client"
version = "0.1.0"
edition = "2021"
description = "HTTP producer SDK for the local Note4 screen scheduler"

[dependencies]
zectrix-core = { package = "zectrix-sdk", path = "../../vendor/zectrix-local-push-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
